name: secret-scan

on:
  pull_request:
  push:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan PR diff for secret-shaped content
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          diff_content="$(git diff "origin/${{ github.base_ref }}...HEAD")"
          pattern='npg_[A-Za-z0-9]{10,}|sk-proj-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|postgres(ql)?://[^ ]*:[^ @]*@|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if echo "$diff_content" | grep -Ei "$pattern" > /dev/null 2>&1; then
            echo "::error::Secret-shaped content found in this PR's diff. Values are never printed by this job - check your diff locally with scripts/scan-secrets.sh (filenames only) or scripts/check-var.sh (PRESENT/ABSENT, max 6 chars) before pushing."
            exit 1
          fi
          echo "Secret scan: clean."

      - name: Scan full tree (push to a branch, no PR diff available)
        if: github.event_name != 'pull_request'
        run: ./scripts/scan-secrets.sh
