<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#1e1e1e;
  --bg-tab-inactive:#2a2a2b;
  --bg-tab-active:#1e1e1e;
  --bg-panel:#181818;
  --bg-card:#242426;
  --bg-card-2:#28282a;
  --border:#37373a;
  --border-soft:#2c2c2e;
  --text:#d4d4d4;
  --text-dim:#8a8a8d;
  --text-faint:#5a5a5d;
  --accent:#4fc1b0;
  --accent-dim:#3a8f83;
  --accent-blue:#5b9fd6;
  --tier-auto:#8fd19e;
  --tier-confirm:#e0bd6b;
  --tier-review:#e06c65;
  --code-str:#ce9b78;
  --shadow: 0 8px 28px rgba(0,0,0,0.45);
  --sans: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px 16px;
}

.app{
  width:100%;
  max-width:1180px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:8px;
  overflow:hidden;
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
}

/* ---------- title bar ---------- */
.titlebar{
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 14px;
  background:#232324;
  border-bottom:1px solid var(--border);
  font-family:var(--mono);
  font-size:11.5px;
  color:var(--text-faint);
}
.dots{display:flex;gap:6px;margin-right:6px;}
.dot{width:10px;height:10px;border-radius:50%;background:#3a3a3c;}
.titlebar .path{color:var(--text-dim);}
.titlebar .path b{color:var(--text);font-weight:500;}

/* ---------- tab strip ---------- */
.tabstrip{
  display:flex;
  overflow-x:auto;
  background:#242425;
  border-bottom:1px solid var(--border);
  scrollbar-width:thin;
}
.tabstrip::-webkit-scrollbar{height:4px;}
.tab{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:7px;
  padding:9px 16px;
  font-family:var(--mono);
  font-size:12px;
  color:var(--text-dim);
  background:var(--bg-tab-inactive);
  border-right:1px solid var(--border-soft);
  border-top:2px solid transparent;
  cursor:pointer;
  white-space:nowrap;
  user-select:none;
  transition:background .12s ease,color .12s ease;
}
.tab:hover{color:var(--text);}
.tab.active{
  background:var(--bg-tab-active);
  color:var(--text);
  border-top:2px solid var(--accent);
}
.tab .dotstate{width:6px;height:6px;border-radius:50%;background:var(--text-faint);flex:0 0 auto;}
.tab.active .dotstate{background:var(--accent);}

/* ---------- editor / slide canvas ---------- */
.editor{
  position:relative;
  background:var(--bg);
  min-height:min(62vh,560px);
  aspect-ratio:16/9.1;
  display:flex;
  overflow:hidden;
}
.gutter{
  flex:0 0 34px;
  background:#1a1a1a;
  border-right:1px solid var(--border-soft);
  font-family:var(--mono);
  font-size:10px;
  color:#3f3f42;
  text-align:right;
  padding:18px 8px 0 0;
  line-height:22px;
  user-select:none;
}
.slide{
  flex:1;
  display:none;
  flex-direction:column;
  padding:34px 46px 30px;
  overflow-y:auto;
}
.slide.active{display:flex;}

.eyebrow{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.08em;
  color:var(--accent);
  text-transform:uppercase;
  margin-bottom:8px;
}
h1.slide-title{
  font-family:var(--sans);
  font-weight:700;
  font-size:clamp(20px,3vw,30px);
  letter-spacing:-0.01em;
  margin:0 0 20px;
  color:#f0f0f0;
  text-wrap:balance;
}

/* ---------- generic bits ---------- */
.mono{font-family:var(--mono);}
.tier-pill{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:11.5px;font-weight:600;
  padding:3px 9px;border-radius:3px;letter-spacing:.02em;
  border:1px solid transparent;
}
.tier-auto{color:var(--tier-auto);background:rgba(143,209,158,0.09);border-color:rgba(143,209,158,0.28);}
.tier-confirm{color:var(--tier-confirm);background:rgba(224,189,107,0.09);border-color:rgba(224,189,107,0.28);}
.tier-review{color:var(--tier-review);background:rgba(224,108,101,0.09);border-color:rgba(224,108,101,0.28);}
.tier-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

svg text{font-family:var(--mono);fill:var(--text);}
svg .lbl{font-size:11.5px;}
svg .lbl-dim{font-size:10.5px;fill:var(--text-dim);}
svg line, svg path.arrow{stroke:var(--text-faint);}
figure{margin:0;}
figcaption{
  font-family:var(--mono);font-size:10.5px;color:var(--text-faint);
  margin-top:8px;
}

/* slide 1 */
.tension{display:flex;gap:22px;align-items:stretch;margin:6px 0 18px;}
.tension .box{
  flex:1;border:1px solid var(--border);background:var(--bg-card);
  border-radius:6px;padding:18px 16px;text-align:center;
}
.tension .box .k{font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.03em;color:#eee;}
.tension .box .v{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);margin-top:6px;}
.tension .box.risk{border-top:2px solid var(--tier-review);}
.tension .box.bottleneck{border-top:2px solid var(--accent-blue);}
.tension .arrows{
  flex:0 0 34px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--text-faint);font-size:18px;
}
.thesis{
  font-family:var(--sans);font-size:17px;font-weight:500;color:#f0f0f0;
  border-left:2px solid var(--accent);padding-left:14px;margin-top:auto;
}

/* slide 2 table */
.gaptable{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:14px;}
.gaptable th{
  text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
  color:var(--text-faint);text-transform:uppercase;padding:0 10px 8px;font-weight:500;
  border-bottom:1px solid var(--border);
}
.gaptable td{padding:10px;border-bottom:1px solid var(--border-soft);vertical-align:top;}
.gaptable tr td:first-child{font-weight:600;color:#e8e8e8;width:38%;}
.gaptable td .cite{color:var(--accent);font-family:var(--mono);font-size:11px;}
.gapstatement{
  margin-top:auto;font-size:16px;font-weight:500;color:#f0f0f0;
  font-family:var(--sans);
}
.gapstatement .q{color:var(--accent);}

/* slide 3 */
.dims{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:12.5px;margin:2px 0 4px;}
.dims .row{display:flex;justify-content:space-between;padding:5px 10px;background:var(--bg-card);border:1px solid var(--border-soft);border-radius:4px;}
.dims .row .w{color:var(--accent);font-weight:600;}
.floor-banner{
  margin-top:12px;border:1px solid var(--border);background:var(--bg-card-2);
  border-radius:6px;padding:12px 14px;
}
.floor-banner .line{font-family:var(--mono);font-size:12px;color:#e8e8e8;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.floor-banner .plus{color:var(--text-faint);}
.floor-banner .cap{font-size:11px;color:var(--text-dim);margin-top:6px;}
.shadow-tag{
  margin-top:10px;display:flex;gap:9px;align-items:flex-start;
  border:1px dashed var(--border);border-radius:6px;padding:9px 12px;
  background:rgba(79,193,176,0.05);
}
.shadow-tag .badge{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--accent);
  border:1px solid var(--accent-dim);border-radius:3px;padding:2px 6px;flex:0 0 auto;
}
.shadow-tag .txt{font-size:11.5px;color:var(--text-dim);line-height:1.5;}

/* slide 4 architecture */
.archwrap{flex:1;display:flex;flex-direction:column;justify-content:center;}
.arch-labels{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.arch-labels span{
  font-family:var(--mono);font-size:10.5px;color:var(--text-dim);
  border:1px solid var(--border-soft);border-radius:3px;padding:3px 8px;background:var(--bg-card);
}

/* slide 5 evidence cards */
.evcards{display:flex;gap:14px;margin-bottom:14px;}
.evcard{flex:1;border:1px solid var(--border);background:var(--bg-card);border-radius:6px;padding:14px 14px 12px;}
.evcard .action{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);}
.evcard .arrow{color:var(--text-faint);margin:6px 0;font-size:13px;}
.evcard .detail{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);margin-top:8px;line-height:1.5;}
.evstrip{display:flex;gap:20px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;color:#dcdcdc;margin-top:2px;}
.evstrip .item{border-left:2px solid var(--accent);padding-left:9px;}
.evstrip .num{color:var(--accent);font-weight:700;}
.caveat{
  margin-top:auto;padding-top:12px;border-top:1px solid var(--border-soft);
  font-size:11px;color:var(--text-dim);line-height:1.55;
}
.caveat b{color:var(--text);}

/* slide 6 readiness */
.readywrap{display:flex;gap:22px;flex:1;min-height:0;}
.readycol{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0;}
.readycol h3{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-faint);margin:0 0 4px;font-weight:500;
}
.check-item{display:flex;gap:8px;font-size:12.5px;color:#dedede;line-height:1.4;}
.check-item .m{color:var(--tier-auto);flex:0 0 auto;font-family:var(--mono);}
.check-item .m.warn{color:var(--tier-confirm);}
.limit-item{font-size:12px;color:#cfcfcf;line-height:1.45;padding:6px 0;border-bottom:1px solid var(--border-soft);}
.limit-item:last-child{border-bottom:none;}
.limit-item .n{font-family:var(--mono);color:var(--accent);margin-right:6px;}
.costbar{
  margin-top:12px;padding-top:10px;border-top:1px solid var(--border-soft);
  display:flex;gap:26px;flex-wrap:wrap;font-size:11px;color:var(--text-dim);
}
.costbar b{color:var(--text);font-family:var(--mono);font-weight:600;}

/* slide 7 demo */
.demolegend{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
.demolegend .row{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12.5px;color:#e6e6e6;}
.demolegend .row .cmd{color:var(--text-dim);}
.terminal{
  background:#161617;border:1px solid var(--border);border-radius:6px;
  padding:14px 16px;font-family:var(--mono);font-size:11.5px;line-height:1.75;
  flex:1;overflow-y:auto;
}
.terminal .prompt{color:var(--accent);}
.terminal .cmdtxt{color:#eee;}
.terminal .out{color:var(--text-dim);}
.terminal .ok{color:var(--tier-auto);}
.terminal .warn{color:var(--tier-confirm);}
.terminal .bad{color:var(--tier-review);}

/* ---------- footer / status bar ---------- */
.statusbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:7px 14px;background:#232324;border-top:1px solid var(--border);
  font-family:var(--mono);font-size:11px;color:var(--text-dim);
}
.statusbar .left{display:flex;align-items:center;gap:14px;min-width:0;}
.statusbar .left .proj{color:var(--accent);white-space:nowrap;}
.statusbar .left .cur{color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.statusbar .right{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
.navbtn{
  background:transparent;border:1px solid var(--border);color:var(--text-dim);
  font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:3px;cursor:pointer;
}
.navbtn:hover{color:var(--text);border-color:var(--accent-dim);}
.navbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.panelbtn{
  background:transparent;border:1px solid var(--border);color:var(--accent);
  font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:3px;cursor:pointer;
}
.panelbtn:hover{background:rgba(79,193,176,0.08);}
.panelbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

/* ---------- bottom drawer ---------- */
.drawer{
  max-height:0;overflow:hidden;background:var(--bg-panel);border-top:0 solid var(--border);
  transition:max-height .22s ease;
}
.drawer.open{max-height:360px;border-top:1px solid var(--border);}
.drawer-tabs{display:flex;gap:2px;padding:8px 14px 0;}
.drawer-tab{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--text-faint);background:transparent;border:none;border-bottom:2px solid transparent;
  padding:7px 10px;cursor:pointer;
}
.drawer-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.drawer-tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.drawer-body{padding:14px 20px 18px;overflow-y:auto;max-height:300px;}
.drawer-pane{display:none;}
.drawer-pane.active{display:block;}

.notes-slidehead{font-family:var(--mono);font-size:10.5px;color:var(--accent);margin-bottom:6px;letter-spacing:.03em;}
.notes-text{font-size:13.5px;line-height:1.65;color:#dedede;max-width:74ch;}

.script-line{display:flex;gap:14px;padding:8px 0;border-bottom:1px solid var(--border-soft);}
.script-line:last-child{border-bottom:none;}
.script-line .t{font-family:var(--mono);font-size:10.5px;color:var(--accent);flex:0 0 78px;padding-top:2px;}
.script-line .s{font-size:12.5px;line-height:1.6;color:#dbdbdb;}
.script-line .s .tag{font-family:var(--mono);font-size:9.5px;color:var(--text-faint);display:block;margin-bottom:2px;letter-spacing:.05em;text-transform:uppercase;}

.reflist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px;}
.reflist li{font-size:12.5px;line-height:1.55;color:#dbdbdb;padding-left:26px;position:relative;}
.reflist li .n{position:absolute;left:0;color:var(--accent);font-family:var(--mono);}
.reflist li .src{color:var(--text-faint);font-family:var(--mono);font-size:11px;display:block;margin-top:2px;}

.audittable{width:100%;border-collapse:collapse;font-size:11.5px;}
.audittable th{
  text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-faint);padding:0 8px 7px;border-bottom:1px solid var(--border);font-weight:500;
}
.audittable td{padding:7px 8px;border-bottom:1px solid var(--border-soft);vertical-align:top;color:#d6d6d6;}
.audittable td.cls{font-family:var(--mono);font-weight:700;text-align:center;width:34px;}
.audittable td.cls.a{color:var(--tier-auto);}
.audittable td.cls.b{color:var(--accent-blue);}
.audittable td.src{font-family:var(--mono);font-size:10px;color:var(--text-faint);}

.hint{font-size:10.5px;color:var(--text-faint);margin-top:12px;}

@media (max-width:760px){
  .tension,.evcards,.readywrap{flex-direction:column;}
  .gutter{display:none;}
  .slide{padding:24px 22px;}
  .script-line{flex-direction:column;gap:2px;}
  .script-line .t{flex:none;}
}
</style>

<script>
/* ============ SLIDE CONTENT ============ */
const slideTabs = [
  "01_problem.md","02_gap.md","03_solution.md","04_architecture.md",
  "05_evidence.md","06_readiness.md","07_demo.sh"
];

const slideTitles = [
  "AI agents have a control problem",
  "Where existing control approaches stop",
  "Graduated Autonomy Engine",
  "Implemented system architecture",
  "Three actions — three oversight levels",
  "From prototype to deployed system",
  "Live governance decision"

const notes = [
"AI agents now take real actions — updates, deletes, calls to other systems. Full autonomy under-oversees the consequential ones; full gating bottlenecks the trivial ones. The right question isn't autonomous-or-not — it's how much oversight each action deserves. (Problem framing: reports/00-project-charter.md:5-8, README.md:16-21.)",
"Prior work sits at the extremes, or gates on fixed, predefined rules. NIST's AI Risk Management Framework calls for human oversight but leaves the mechanism open, and the signal you'd calibrate oversight to — model confidence — is itself known to be poorly calibrated. That's the open gap: proportional oversight.",
"Every proposed action gets a weighted composite across four dimensions — reversibility weighted highest at 0.40, verified in app/risk/scorer.py:50-56. Two thresholds (0.30 / 0.65, app/risk/tiers.py:10-11) route it to autonomous, confirm, or full review. Deterministic safety floors sit above that score and can only escalate the tier — proven by an assert in app/risk/floors.py:97-100. Adaptive calibration runs in shadow mode: bounded ±0.10, minimum 5 decisions, audited, never applied to routing in this deployment (app/calibration.py:1-33; README L-C).",
"It's a FastAPI service (10 endpoints, app/main.py) backed by Postgres. Each /v1/actions/evaluate call scores the action, calls a pinned OpenAI model (gpt-5.6-luna, live-verified T-03) for one confidence signal, applies the floors, and writes an append-only, SHA-256 hash-chained record (app/audit.py:16,30-61) to Postgres. Failures fail closed — an LLM safety refusal is terminal and never retried (app/llm.py:159-173). /livez does no I/O; /readyz deep-checks the DB and LLM (app/main.py:144-162), matching the platform's ~2s health-check timeout.",
"Live against Railway: 12 of 12 runs across the three canonical actions matched the expected tier (reports/evidence/final-demo-capture.json, commit a076248). 144 tests pass, 6 skipped, verified live this session. The bulk-delete case is the clearest proof the floors do real work: its weighted composite alone (0.642) only reaches CONFIRM — the irreversible_bulk floor is what forces FULL_REVIEW. Honest caveat: composite scores are not reproducible across process restarts because the in-process LLM confidence cache resets (README L-A) — the same payload scored 0.642 then 0.735 after a restart. Tiers stay stable wherever a floor applies, since floors read raw inputs, never the composite. Audit records reconstruct exactly, since raw inputs, weights_version, and llm_model are all persisted.",
"Implemented and verified: real LLM provider, Postgres persistence with a hash-chained audit log, a working API, health checks, 144 passing tests, and two independent live deployments — Railway, proven by curl (reports/evidence/T-14-curl.txt), and AWS Lambda behind a public Function URL, proven by curl against /livez and a real evaluate call (isolated AWS clone, reports/evidence/T-15-live-verification.txt). Railway remains the deployment of record for the demo; AWS demonstrates the system is genuinely portable, not tied to one platform. Honest limitations: composite-score drift across restarts; adaptive calibration is shadow-only; calibration observations can inherit reviewer bias. Cost was not measured in this project — a billing alarm was planned but never confirmed active.",
"Three commands, three tiers, run live against the deployed Railway service (demo.sh, BASE_URL=aivartba-production.up.railway.app). Read-only auto-executes. A single update requires the CLI's interactive confirm prompt (cli.py:235, 'Confirm? [y/N]'). An irreversible bulk delete — 5,000 records — trips the irreversible_bulk safety floor straight to FULL_REVIEW, regardless of its weighted score. That's proportional oversight: a weighted estimate, with deterministic floors that can only make it stricter, and a calibration layer that's earning trust in shadow before it's ever allowed to steer."
];

function goTo(i){
  cur = (i+N)%N;
  document.querySelectorAll('.tab').forEach((t,idx)=>t.classList.toggle('active',idx===cur));

document.getElementById('nextBtn').addEventListener('click',()=>goTo(cur+1));

document.addEventListener('keydown',(e)=>{

  else if(e.key==='ArrowLeft'){goTo(cur-1);}
